    "flags.json": "{\n  \"$schema\": \"https://flagd.dev/schema/v0/flags.json\",\n  \"flags\": {\n    \"cartSecondaryStoreShare\": {\n      \"defaultVariant\": \"off\",\n      \"description\": \"Share of cart operations routed to the secondary cart store\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"10%\": 0.1,\n        \"100%\": 1,\n        \"25%\": 0.25,\n        \"50%\": 0.5,\n        \"75%\": 0.75,\n        \"90%\": 0.9,\n        \"off\": 0\n      }\n    },\n    \"cartDrainMode\": {\n      \"defaultVariant\": \"off\",\n      \"description\": \"Report cart as not ready so traffic drains off it\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"off\": false,\n        \"on\": true\n      }\n    },\n    \"paymentStrictTokenCheck\": {\n      \"defaultVariant\": \"100%\",\n      \"description\": \"Share of charge requests routed through strict card-token validation\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"10%\": 0.1,\n        \"100%\": 1,\n        \"25%\": 0.25,\n        \"50%\": 0.5,\n        \"75%\": 0.75,\n        \"90%\": 0.95,\n        \"off\": 0\n      }\n    },\n    \"browseJourneyEnabled\": {\n      \"defaultVariant\": \"on\",\n      \"description\": \"Run the browse and checkout journeys. Turn off to pause them.\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"off\": 0,\n        \"on\": 1\n      }\n    },\n    \"browseJourneyConcurrency\": {\n      \"defaultVariant\": \"5\",\n      \"description\": \"Concurrent sessions for the browse journey. Applied on the runner's next poll.\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"10\": 10,\n        \"25\": 25,\n        \"5\": 5,\n        \"50\": 50\n      }\n    },\n    \"homepagePrefetchBurst\": {\n      \"defaultVariant\": \"off\",\n      \"description\": \"Extra homepage requests issued per browse session\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"off\": 0,\n        \"20\": 20,\n        \"50\": 50,\n        \"100\": 100\n      }\n    },\n    \"adServeFallback\": {\n      \"defaultVariant\": \"off\",\n      \"description\": \"Serve fallback ads instead of targeted ones\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"off\": false,\n        \"on\": true\n      }\n    },\n    \"adRankingDepth\": {\n      \"defaultVariant\": \"off\",\n      \"description\": \"Deep ranking pass for ad selection\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"off\": false,\n        \"on\": true\n      }\n    },\n    \"adHeapCompaction\": {\n      \"defaultVariant\": \"off\",\n      \"description\": \"Force heap compaction between ad requests\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"off\": false,\n        \"on\": true\n      }\n    },\n    \"catalogStrictLookup\": {\n      \"defaultVariant\": \"off\",\n      \"description\": \"Strict product lookup validation in the catalog\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"off\": false,\n        \"on\": true\n      }\n    },\n    \"imageLazyLoadDelay\": {\n      \"defaultVariant\": \"off\",\n      \"description\": \"Delay (ms) before product images load\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"off\": 0,\n        \"5sec\": 5000,\n        \"10sec\": 10000\n      }\n    },\n    \"orderQueueBatching\": {\n      \"defaultVariant\": \"off\",\n      \"description\": \"Batch order events onto the queue\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"off\": 0,\n        \"on\": 100\n      }\n    },\n    \"paymentMaintenanceMode\": {\n      \"defaultVariant\": \"off\",\n      \"description\": \"Payment service maintenance mode\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"off\": false,\n        \"on\": true\n      }\n    },\n    \"recommendationCacheBypass\": {\n      \"defaultVariant\": \"off\",\n      \"description\": \"Bypass the recommendation cache\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"off\": false,\n        \"on\": true\n      }\n    },\n    \"intlShippingQuoteDelay\": {\n      \"defaultVariant\": \"off\",\n      \"description\": \"Extra seconds added to international shipping quotes\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"off\": 0,\n        \"5sec\": 5,\n        \"10sec\": 10\n      }\n    },\n    \"emailTemplateCache\": {\n      \"defaultVariant\": \"off\",\n      \"description\": \"Email template cache multiplier\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"off\": 0,\n        \"1x\": 1,\n        \"10x\": 10\n      }\n    }\n  }\n}"
