apiVersion: v1
kind: PersistentVolume
metadata:
  name: index-store
  labels: {app: index-store}
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-archive
  local:
    path: /mnt/archive
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: storage-tier
              operator: In
              values: [nvme-archive]
