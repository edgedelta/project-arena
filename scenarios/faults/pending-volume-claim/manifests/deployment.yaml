apiVersion: apps/v1
kind: Deployment
metadata:
  name: archive-writer
  namespace: batch
  labels: {app: archive-writer}
spec:
  replicas: 1
  selector: {matchLabels: {app: archive-writer}}
  template:
    metadata:
      labels: {app: archive-writer}
    spec:
      terminationGracePeriodSeconds: 0
      automountServiceAccountToken: false
      containers:
        - name: main
          image: fixture.local/archive-writer:v1
          volumeMounts:
            - name: archive
              mountPath: /archive
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
      volumes:
        - name: archive
          persistentVolumeClaim:
            claimName: archive-writer
