apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: pod-policy
  labels: {app: pod-policy}
webhooks:
  - name: pod-policy.platform-ops.svc
    clientConfig:
      service:
        name: pod-policy-webhook
        namespace: platform-ops
        path: /validate
        port: 443
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced
    failurePolicy: Fail
    sideEffects: None
    admissionReviewVersions: ["v1"]
    timeoutSeconds: 5
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: shop}
